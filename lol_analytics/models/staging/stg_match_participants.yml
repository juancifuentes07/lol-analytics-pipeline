version: 2

models:
  - name: stg_match_participants
    columns:
      - name: match_id
        data_tests:
          - not_null
      - name: puuid
        data_tests:
          - not_null
      - name: win
        data_tests:
          - not_null
      - name: team_position
        data_tests:
          - accepted_values:
              values: ['TOP', 'JUNGLE', 'MIDDLE', 'BOTTOM', 'UTILITY']